<div id="tab-ranking" class="tab-content">
  <section class="ranking-hero">
    <div>
      <span class="eyebrow">PLACAR OFICIAL</span>
      <h2><i class="fa-solid fa-trophy"></i> Ranking das turmas</h2>
      <p>O placar considera somente ocorrências <strong>aprovadas pela EEB/Gestão</strong>, além das bonificações e penalidades por denúncia falsa.</p>
    </div>
    <div class="official-badge"><i class="fa-solid fa-shield-check"></i> Dados validados</div>
  </section>

  <div class="glass-card ranking-filter-card">
    <div class="month-filter-group">
      <span class="filter-label">Período</span>
      <button class="btn-month-filter active" id="filterSet" onclick="setRankingMonth('09')">🚌 Setembro</button>
      <button class="btn-month-filter" id="filterOut" onclick="setRankingMonth('10')">🍿 Outubro</button>
      <button class="btn-month-filter" id="filterNov" onclick="setRankingMonth('11')">🎁 Novembro</button>
      <button class="btn-month-filter" id="filterAll" onclick="setRankingMonth('ALL')">Consolidado</button>
    </div>
  </div>

  <div id="rankingContainer" class="ranking-grid"></div>
</div>
