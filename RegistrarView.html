<div id="tab-registrar" class="tab-content active">
  <div class="info-rules-banner" onclick="switchTab('tab-regulamento')">
    <div style="display:flex;align-items:center;gap:12px;"><i class="fa-solid fa-circle-info" style="font-size:1.4rem;color:var(--gold-accent);"></i><div><strong style="color:white;font-size:.9rem;">Dúvidas sobre os 100 pontos e as premiações?</strong><p style="font-size:.75rem;color:var(--text-sub);margin-top:2px;">Consulte os critérios de pontuação e as premiações de <strong>Setembro (Excursão)</strong>, <strong>Outubro (Cinema)</strong> e <strong>Novembro (Brindes)</strong>.</p></div></div>
    <button type="button" style="background:var(--gold-accent);color:#0b1329;border:none;padding:6px 14px;border-radius:8px;font-weight:800;font-size:.75rem;cursor:pointer;white-space:nowrap;">Ver Regulamento &rarr;</button>
  </div>
  <div id="repImpartialityBanner" class="impartiality-banner" style="display:none;"><i class="fa-solid fa-shield-halved" style="font-size:1.6rem;color:#c4b5fd;"></i><div><strong style="color:#f5f3ff;font-size:.9rem;">REGRA DE IMPARCIALIDADE ATIVA:</strong><p id="repImpartialityText" style="font-size:.8rem;color:#ddd6fe;margin-top:3px;line-height:1.4;"></p></div></div>
  <div class="glass-card">
    <div class="card-title"><div><i class="fa-solid fa-pen-to-square"></i> Registrar Regra Descumprida (Punição Coletiva)</div><span id="permissionStatusBadge" style="font-size:.75rem;padding:4px 10px;border-radius:12px;background:rgba(16,185,129,.2);color:#34d399;font-weight:700;"><i class="fa-solid fa-lock-open"></i> Edição Autorizada</span></div>
    <form id="occForm" onsubmit="handleFormSubmit(event)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;"><div><label style="font-size:.8rem;font-weight:700;color:var(--text-sub);">1. SELECIONE A TURMA AVALIADA <small id="lblAvaliandoInfo" style="color:var(--gold-accent);"></small></label><select id="roomSelect" class="custom-select" required onchange="populateStudents()"><option value="">-- Selecione a Turma --</option></select></div><div><label style="font-size:.8rem;font-weight:700;color:var(--text-sub);">2. ESTUDANTE DA TURMA (1º + ÚLTIMO NOME)</label><select id="studentSelect" class="custom-select" required disabled><option value="">-- Selecione a Turma primeiro --</option></select></div></div>
      <div style="margin-bottom:16px;"><label style="font-size:.8rem;font-weight:700;color:var(--text-sub);">3. REGRA DESCUMPRIDA (CONFORME REGULAMENTO)</label><div class="rules-selector" style="margin-top:6px;">
        <div><input type="radio" name="ruleOption" id="r1" value="1. Sem Uniforme" class="rule-item-radio" required><label for="r1" class="rule-card"><i class="fa-solid fa-shirt" style="color:var(--gold-accent);font-size:1.2rem;"></i><div><strong>1. Sem Uniforme</strong><br><small style="color:var(--text-sub);">Critério 1 (Uniforme — 40 pts)</small></div></label></div>
        <div><input type="radio" name="ruleOption" id="r2" value="2. Sem Sapato Fechado" class="rule-item-radio"><label for="r2" class="rule-card"><i class="fa-solid fa-shoe-prints" style="color:var(--gold-accent);font-size:1.2rem;"></i><div><strong>2. Sem Sapato Fechado</strong><br><small style="color:var(--text-sub);">Critério 2 (Segurança — 30 pts)</small></div></label></div>
        <div><input type="radio" name="ruleOption" id="r3" value="3. Atraso Entrada" class="rule-item-radio"><label for="r3" class="rule-card"><i class="fa-solid fa-clock" style="color:var(--gold-accent);font-size:1.2rem;"></i><div><strong>3. Atraso Entrada</strong><br><small style="color:var(--text-sub);">Critério 3 (Horário/Tolerância — 20 pts)</small></div></label></div>
        <div><input type="radio" name="ruleOption" id="r4" value="4. Fora de Sala" class="rule-item-radio"><label for="r4" class="rule-card"><i class="fa-solid fa-person-walking-arrow-right" style="color:var(--gold-accent);font-size:1.2rem;"></i><div><strong>4. Fora de Sala</strong><br><small style="color:var(--text-sub);">Critério 4 (Permanência — 10 pts)</small></div></label></div>
      </div></div>
      <div style="margin-bottom:16px;"><label style="font-size:.8rem;font-weight:700;color:var(--text-sub);">4. OBSERVAÇÃO</label><input type="text" id="obsInput" class="custom-input" placeholder="Ex: Registrado pelo colaborador da turma"></div>
      <button type="submit" class="btn-submit-occ" id="btnSubmitOcc"><i class="fa-solid fa-cloud-arrow-up"></i> REGISTRAR NO GOOGLE SHEETS</button>
    </form>
  </div>
</div>
