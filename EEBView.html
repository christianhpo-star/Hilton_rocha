<div id="tab-eeb-manager" class="tab-content">
  <div class="glass-card">
    <div class="card-title"><div><i class="fa-solid fa-user-gear"></i> Gestão EEB — Estudantes</div></div>
    <form onsubmit="handleCadastrarAluno(event)" style="display:grid;grid-template-columns:1fr 2fr auto;gap:10px;margin-bottom:16px;"><select id="cadTurmaSelect" class="custom-select" required><option value="">Turma</option></select><input id="cadNomeCompleto" class="custom-input" placeholder="Nome completo" required><button class="btn-submit-occ" style="margin:0;width:auto;" type="submit">Adicionar</button></form>
    <select id="removerTurmaSelect" class="custom-select" onchange="renderAlunosRemover()"><option value="">Selecione a turma para gerenciar estudantes</option></select><div id="listaAlunosRemoverContainer" style="margin-top:12px;"></div>
  </div>
  <div class="glass-card">
    <div class="card-title"><div><i class="fa-solid fa-users-gear"></i> Representantes e Permissões</div></div>
    <form onsubmit="handleSalvarPermissao(event)" style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;margin-bottom:16px;"><input id="permEmailInput" type="email" class="custom-input" placeholder="E-mail institucional" required><select id="permOwnRoomSelect" class="custom-select" required><option value="">Turma de origem</option></select><select id="permCanEditSelect" class="custom-select"><option value="true">Ativo</option><option value="false">Bloqueado</option></select><button class="btn-submit-occ" style="margin:0;width:auto;background:linear-gradient(135deg,#8b5cf6,#6d28d9);" type="submit">Salvar</button></form>
    <div style="overflow-x:auto;"><table class="app-table"><thead><tr><th>E-mail</th><th>Perfil</th><th>Turma</th><th>Acesso</th><th>Editar?</th></tr></thead><tbody id="permTbody"></tbody></table></div>
  </div>
  <div class="glass-card" style="border-color:#d97706;">
    <div class="card-title" style="color:#fbbf24;"><div><i class="fa-solid fa-shield-circle-exclamation"></i> Auditoria de Denúncias Falsas</div><span style="font-size:.75rem;color:var(--text-sub);">A ocorrência falsa é retirada da turma acusada e a turma do denunciante perde 1 ponto quando aplicável.</span></div>
    <div style="overflow-x:auto;"><table class="app-table"><thead><tr><th>Revisão</th><th>Turma / Estudante</th><th>Regra</th><th>Denunciante</th><th>Turma Penalizada</th><th>Penalidade</th><th>Motivo / Revisor</th></tr></thead><tbody id="falseReportsBody"></tbody></table></div>
  </div>
</div>
