<style>
:root{

  --green-accent:#10b981;--purple-accent:#8b5cf6;--cyan-accent:#22d3ee;

}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.top-navbar{background:rgba(5,14,28,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid rgba(148,163,184,.13);padding:13px 22px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;gap:18px;box-shadow:0 8px 30px rgba(2,8,23,.18)}
.brand-container{display:flex;align-items:center;gap:13px;min-width:max-content}.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#3b82f6,#7c3aed);color:white;display:flex;align-items:center;justify-content:center;font-size:1.18rem;box-shadow:0 8px 24px rgba(59,130,246,.28)}

.nav-right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.user-auth-info{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.055);border:1px solid var(--card-border);padding:7px 11px;border-radius:999px;font-size:.74rem;color:#dbeafe;max-width:310px;overflow:hidden}.user-auth-info i{color:#34d399}.user-auth-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-actions{display:flex;gap:6px;flex-wrap:wrap}.btn-tab{position:relative;background:rgba(255,255,255,.055);border:1px solid rgba(148,163,184,.15);color:#cbd5e1;padding:8px 12px;border-radius:999px;font-weight:750;cursor:pointer;font-size:.77rem;display:inline-flex;align-items:center;gap:6px;transition:transform .18s ease,background .18s ease,border-color .18s ease,color .18s ease}.btn-tab:hover{transform:translateY(-1px);background:rgba(255,255,255,.1);color:white}.btn-tab.active{background:linear-gradient(135deg,rgba(59,130,246,.95),rgba(99,102,241,.95));border-color:#60a5fa;color:white;box-shadow:0 7px 20px rgba(37,99,235,.24)}.btn-tab.rules-tab{color:#fde68a;border-color:rgba(245,158,11,.3)}.btn-tab.eeb-only{color:#ddd6fe;border-color:rgba(139,92,246,.35)}.nav-count-badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#f97316;color:white;display:inline-flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:900;box-shadow:0 0 0 3px rgba(249,115,22,.15)}

.main-wrapper{max-width:1240px;margin:24px auto 0;padding:0 18px}.tab-content{display:none;animation:tabIn .24s ease}.tab-content.active{display:block}@keyframes tabIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.form-card-modern{padding:24px}.form-grid-two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px}.field-block{margin-bottom:18px}.field-block>label{display:flex;align-items:center;gap:8px;color:#e2e8f0;font-size:.8rem;font-weight:800;margin-bottom:8px}.field-number{width:24px;height:24px;border-radius:8px;background:rgba(59,130,246,.16);color:#93c5fd;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem}.optional-label{margin-left:auto;color:var(--text-muted);font-weight:650}.custom-select,.custom-input{width:100%;background:rgba(5,15,30,.58);border:1px solid rgba(148,163,184,.18);border-radius:var(--radius-md);padding:13px 14px;color:white;font-size:.9rem;outline:none;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}.custom-select:hover,.custom-input:hover{background:rgba(8,20,38,.72);border-color:rgba(148,163,184,.28)}.custom-select:focus,.custom-input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.13)}.custom-select:disabled{opacity:.55;cursor:not-allowed}

.submission-note{display:flex;align-items:flex-start;gap:9px;background:rgba(14,116,144,.12);border:1px solid rgba(34,211,238,.18);border-radius:13px;padding:11px 13px;color:#bae6fd;font-size:.75rem;line-height:1.45}.submission-note i{margin-top:2px;color:#22d3ee}.btn-submit-occ{width:100%;border:none;border-radius:14px;padding:14px 16px;font-weight:900;font-size:.9rem;cursor:pointer;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .18s ease,box-shadow .18s ease,opacity .18s}.btn-submit-occ:disabled{opacity:.58;cursor:not-allowed}.btn-submit-review{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;box-shadow:0 12px 28px rgba(37,99,235,.22)}.btn-submit-review:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 32px rgba(37,99,235,.28)}

.management-hero{justify-content:space-between}.pending-counter-card{min-width:150px;border-radius:18px;background:rgba(7,18,34,.6);border:1px solid rgba(245,158,11,.2);padding:17px;text-align:center;z-index:1}.pending-counter{display:block;font-family:'Outfit';font-size:2.4rem;font-weight:900;color:#fbbf24;line-height:1}.pending-counter-card small{font-size:.67rem;color:#cbd5e1;font-weight:750}.review-filter-group{display:flex;gap:5px;flex-wrap:wrap}.review-filter{background:rgba(255,255,255,.04);border:1px solid rgba(148,163,184,.14);color:#94a3b8;border-radius:999px;padding:6px 9px;font-size:.68rem;font-weight:800;cursor:pointer}.review-filter.active{background:#2563eb;border-color:#60a5fa;color:white}.decision-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.legend-item{font-size:.67rem;padding:6px 9px;border-radius:999px;font-weight:750}.legend-item.approve{color:#6ee7b7;background:rgba(16,185,129,.1)}.legend-item.deny{color:#cbd5e1;background:rgba(100,116,139,.13)}.legend-item.false{color:#fca5a5;background:rgba(239,68,68,.1)}.review-queue-list{display:grid;gap:11px}.review-item{position:relative;background:rgba(7,18,34,.57);border:1px solid rgba(148,163,184,.13);border-radius:17px;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;transition:border-color .18s,transform .18s}.review-item:hover{border-color:rgba(96,165,250,.3);transform:translateY(-1px)}.review-item-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}.review-item-title{font-size:.88rem;font-weight:850}.review-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--text-sub);font-size:.68rem;margin-top:6px}.review-obs{font-size:.73rem;color:#cbd5e1;margin-top:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.035)}.review-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.review-action{border:none;border-radius:10px;padding:8px 10px;font-size:.7rem;font-weight:850;cursor:pointer;display:inline-flex;align-items:center;gap:5px}.review-action.approve{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.25)}.review-action.deny{background:rgba(100,116,139,.15);color:#cbd5e1;border:1px solid rgba(148,163,184,.2)}.review-action.false{background:rgba(239,68,68,.13);color:#fca5a5;border:1px solid rgba(239,68,68,.25)}.review-action:disabled{opacity:.45;cursor:not-allowed}.management-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.management-form-grid{display:grid;grid-template-columns:1fr 1.5fr auto;gap:8px;margin-bottom:12px}.management-form-stack{display:grid;gap:8px}.btn-secondary-action{border:1px solid rgba(59,130,246,.28);background:rgba(59,130,246,.13);color:#bfdbfe;border-radius:12px;padding:10px 12px;font-weight:850;cursor:pointer}.btn-secondary-action.purple{border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.13);color:#ddd6fe}.student-management-list{margin-top:10px;max-height:260px;overflow:auto}.audit-card{border-color:rgba(239,68,68,.16)}

.ranking-hero{justify-content:space-between}.official-badge{z-index:1;padding:8px 11px;border-radius:999px;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.2);color:#6ee7b7;font-size:.72rem;font-weight:850;white-space:nowrap}.ranking-filter-card{padding:13px 16px}.month-filter-group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.filter-label{font-size:.68rem;font-weight:850;color:var(--text-sub);text-transform:uppercase;letter-spacing:.08em;margin-right:4px}.btn-month-filter{background:rgba(255,255,255,.045);border:1px solid rgba(148,163,184,.14);color:#94a3b8;padding:7px 11px;border-radius:999px;font-size:.7rem;font-weight:800;cursor:pointer}.btn-month-filter.active{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1c1917;border-color:#fbbf24}.ranking-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.ranking-card{background:linear-gradient(160deg,rgba(17,36,62,.9),rgba(9,23,42,.88));border:1px solid rgba(148,163,184,.14);border-radius:20px;padding:17px;box-shadow:var(--shadow-soft)}.ranking-card.leader{border-color:rgba(245,158,11,.38);box-shadow:0 18px 45px rgba(245,158,11,.07)}.ranking-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.rank-place{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;border-radius:12px;background:rgba(59,130,246,.12);color:#93c5fd;font-family:'Outfit';font-weight:900}.ranking-card.leader .rank-place{background:rgba(245,158,11,.14);color:#fbbf24}.ranking-room{flex:1}.ranking-room strong{font-size:.84rem}.ranking-room small{display:block;color:var(--text-sub);font-size:.65rem;margin-top:2px}.ranking-score{font-family:'Outfit';font-size:1.8rem;font-weight:900}.ranking-score small{font-family:'Plus Jakarta Sans';font-size:.6rem;color:var(--text-sub);font-weight:700}.main-progress-track{background:rgba(2,8,23,.55);border:1px solid rgba(148,163,184,.1);border-radius:999px;height:12px;overflow:hidden;padding:2px;margin:12px 0}.main-progress-fill{height:100%;border-radius:999px;transition:width .65s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,#3b82f6,#22d3ee)}.score-breakdown{display:flex;gap:6px;flex-wrap:wrap}.score-chip{font-size:.64rem;color:#cbd5e1;background:rgba(255,255,255,.04);padding:5px 7px;border-radius:8px}.score-chip.positive{color:#6ee7b7;background:rgba(16,185,129,.08)}.score-chip.negative{color:#fca5a5;background:rgba(239,68,68,.08)}

.prize-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.prize-card{background:rgba(7,18,34,.58);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:16px;text-align:center;transition:all .2s}.prize-card:hover{transform:translateY(-2px);border-color:rgba(245,158,11,.4)}.prize-icon{font-size:2.2rem;margin-bottom:8px}.prize-month{font-size:.75rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-accent)}.prize-title{font-family:'Outfit';font-size:1.1rem;font-weight:800;color:white;margin:4px 0}.prize-desc{font-size:.75rem;color:var(--text-sub);line-height:1.3}.criteria-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}.criteria-box{background:rgba(7,18,34,.55);border:1px solid var(--card-border);border-radius:var(--radius-md);padding:14px;display:flex;gap:14px;align-items:flex-start}.criteria-badge{background:var(--blue-accent);color:white;font-weight:900;font-size:.95rem;padding:8px 12px;border-radius:10px;min-width:75px;text-align:center}.mural-card{background:rgba(7,18,34,.55);border:1px solid rgba(245,158,11,.2);border-radius:14px;padding:13px 14px}
